<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">

font-family: Arial, sans-serif;

        }
</style>
</head>
<body>

<header>

<main>
<a>.<a>
</main>

<textarea id="texto" placeholder="Mensagem"></textarea>
<br>

<button onclick="enviar()">
Enviar
</button>

<div id="mensagens"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
updateDoc,
doc,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyCse8bgGnei4AGlocS2U4lxy9QQunkoWcU",
  authDomain: "online-90734.firebaseapp.com",
  projectId: "online-90734",
  storageBucket: "online-90734.firebasestorage.app",
  messagingSenderId: "727708437579",
  appId: "1:727708437579:web:d9c999d87234d12d4a11ce",
  measurementId: "G-QES42NTMYN"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

window.enviar = async function(){

const usuario = auth.currentUser;

if (!usuario) {
    alert("Você precisa fazer login.");
    return;
}

let texto =
document.getElementById("texto").value;

await addDoc(collection(db, "mensagens"), {

    nome: usuario.email.split("@")[0],
    uid: usuario.uid,
    curtidas: 0,
    texto: texto,
    data: Date.now(),
    hora: new Date().toLocaleTimeString()

});

};

const q = query(
    collection(db, "mensagens"),
    orderBy("data")
);

onSnapshot(q, (snapshot) => {

    let area =
        document.getElementById("mensagens");

    area.innerHTML = "";

    snapshot.forEach((doc) => {

        let msg = doc.data();

        let botaoApagar = "";
        let botaoEditar = "";
        if (auth.currentUser && auth.currentUser.uid === msg.uid) {
            botaoApagar = `<button onclick="apagar('${doc.id}')">🗑️ Apagar</button>`;
            botaoEditar = `<button onclick="editar('${doc.id}')">✏️ Editar</button>`;
        }

        area.innerHTML += `
            <div style="
                background:white;
                padding:10px;
                margin:10px;
                border-radius:10px;
            ">

                <strong>${msg.nome}</strong>

                <br><br>

${botaoEditar} ${botaoApagar}
<button onclick="curtir('${doc.id}', ${msg.curtidas || 0})">❤️ ${msg.curtidas || 0}</button>

${msg.hora || "00:00"}

                ${msg.texto}

            </div>
        `;

    });

});


window.curtir = async function(id, curtidas){
 await updateDoc(doc(db,"mensagens",id),{curtidas:curtidas+1});
};

window.editar = async function(id){
 const elemento=[...document.querySelectorAll('#mensagens button')];
 const textoEl = event.target.closest('div').querySelector('strong').nextSibling;
 const atual = event.target.closest('div').innerText.split('\n').slice(-1)[0].trim();
 const novo=prompt("Editar mensagem:",atual);
 if(novo!==null && novo.trim()!==""){
   await updateDoc(doc(db,"mensagens",id),{texto:novo});
 }
};


window.apagar = async function(id){

    await deleteDoc(doc(db, "mensagens", id));
};

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    }
});
</script>

</body>
</html>

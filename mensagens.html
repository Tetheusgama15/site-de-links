<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mensagens</title>

<style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
        }

        header {
            background-color: #00FFFF;
            color: black;
            padding: 1px;
        }

        main {
            margin: 1px;
        }

        button {
            padding: 10px 10px;
            border: none;
            background-color: #0000FF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff2c2c;
        }
</style>
</head>
<body>

<h1>Site de Mensagens</h1>

<textarea id="texto" placeholder="Escreva aqui..."></textarea>
<br>

<button onclick="enviarMensagem()">
    Enviar
</button>

<div id="mensagens"></div>

<script>
function enviarMensagem() {

    let texto = document.getElementById("texto").value;

    if (texto.trim() === "") {
        return;
    }

    let novaMensagem = document.createElement("div");

    novaMensagem.className = "msg";

    novaMensagem.innerText = texto;

    document.getElementById("mensagens")
        .appendChild(novaMensagem);

    document.getElementById("texto").value = "";
}
</script>

</body>
</html>

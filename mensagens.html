<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mensagens</title>

<style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
        }

        header {
            background-color: #00FFFF;
            color: black;
            padding: 1px;
        }

        main {
            margin: 1px;
        }

        button {
            padding: 10px 10px;
            border: none;
            background-color: #0000FF;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff2c2c;
        }
</style>
</head>
<body>

<h1>Site de Mensagens</h1>

<button onclick="iniciarsite()">Voltar ao Site Original</button>

<script>
function iniciarsite() {
    window.location.href = "index.html";
}
</script>

<button onclick="sitelogin()">Login</button>

<script>
function sitelogin() {
    window.location.href = "login.html";
}
</script>

<textarea id="texto" placeholder="Mensagem"></textarea>
<br>

<button onclick="enviar()">
Enviar
</button>

<div id="mensagens"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
deleteDoc,
doc,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyCse8bgGnei4AGlocS2U4lxy9QQunkoWcU",
  authDomain: "online-90734.firebaseapp.com",
  projectId: "online-90734",
  storageBucket: "online-90734.firebasestorage.app",
  messagingSenderId: "727708437579",
  appId: "1:727708437579:web:d9c999d87234d12d4a11ce",
  measurementId: "G-QES42NTMYN"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);

window.enviar = async function(){

const usuario = auth.currentUser;

if (!usuario) {
    alert("Você precisa fazer login.");
    return;
}

let texto =
document.getElementById("texto").value;

await addDoc(collection(db, "mensagens"), {

    nome: usuario.email.split("@")[0],
    texto: texto,
    data: Date.now(),
    hora: new Date().toLocaleTimeString()

});

};

const q = query(
    collection(db, "mensagens"),
    orderBy("data")
);

onSnapshot(q, (snapshot) => {

    let area =
        document.getElementById("mensagens");

    area.innerHTML = "";

    snapshot.forEach((doc) => {

        let msg = doc.data();

        area.innerHTML += `
            <div style="
                background:white;
                padding:10px;
                margin:10px;
                border-radius:10px;
            ">

                <strong>${msg.nome}</strong>

                <br><br>

<button onclick="apagar('${doc.id}')">
Apagar
</button>

${msg.hora || "00:00"}

                ${msg.texto}

            </div>
        `;

    });

});

window.apagar = async function(id){

    await deleteDoc(doc(db, "mensagens", id));
};

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    }
});
</script>

</body>
</html>

<input type="text" id="nome" placeholder="Seu nome">
<br>

<textarea id="texto" placeholder="Escreva algo..."></textarea>
<br>

<div id="mensagens"></div>

<script>

async function enviar(){
}

window.enviar = enviar;

let mensagens = JSON.parse(localStorage.getItem("mensagens")) || [];

function salvarMensagens() {
    localStorage.setItem("mensagens", JSON.stringify(mensagens));
}

function mostrarMensagens() {

    let area = document.getElementById("mensagens");

    area.innerHTML = "";

    mensagens.forEach((msg, index) => {

        let div = document.createElement("div");

        div.className = "msg";

        div.innerHTML = `
            <div class="info">
                <strong>${msg.nome}</strong> • ${msg.hora}
            </div>

            <div>
                ${msg.texto}
            </div>

            <div class="acoes">
                ❤️ ${msg.likes}

                <button onclick="curtir(${index})">
                    Curtir
                </button>

                <button onclick="apagar(${index})">
                    Apagar
                </button>
            </div>
        `;

        area.appendChild(div);

    });
}

function enviarMensagem() {

    let nome = document.getElementById("nome").value;
    let texto = document.getElementById("texto").value;

    if(nome.trim() === "" || texto.trim() === "") {
        return;
    }

    let agora = new Date();

    let horario =
        agora.getHours().toString().padStart(2, '0')
        + ":"
        +
        agora.getMinutes().toString().padStart(2, '0');

    mensagens.push({
        nome: nome,
        texto: texto,
        hora: horario,
        likes: 0
    });

    salvarMensagens();

    mostrarMensagens();

    document.getElementById("texto").value = "";
}

function curtir(index) {

    mensagens[index].likes++;

    salvarMensagens();

    mostrarMensagens();
}

function apagar(index) {

    mensagens.splice(index, 1);

    salvarMensagens();

    mostrarMensagens();
}

mostrarMensagens();

</script>

</body>
